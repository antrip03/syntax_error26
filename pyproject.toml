[project]
name = "archive"
version = "0.1.0"
description = "The Archive: grounded villager LLMs for a murder-mystery game (Syntax Error 2026, PS3)"
requires-python = ">=3.11"
# Pinned to what runs on the GPU server, so code written on laptops behaves the same there.
dependencies = [
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.170.9"]
# Only for the prompt token-budget test (Qwen3 tokenizer). Server envs use transformers 4.57.1 (SGLang) and 5.20.2 (AlignTune); both load the same tokenizer.
tokenizer = ["transformers==4.57.1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["archive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
