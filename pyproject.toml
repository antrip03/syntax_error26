[project]
name = "archive"
version = "0.1.0"
description = "The Archive: grounded villager LLMs for a murder-mystery game (Syntax Error 2026, PS3)"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.170.9"]
tokenizer = ["transformers==4.57.1", "jinja2==3.1.6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["archive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
