[project]
name = "finseries"
version = "0.1.0"
description = "FinSeries-RLVR: verifiable-reward RL for temporal reasoning over financial series (analysis only, no forecasting)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml"]

[tool.setuptools.packages.find]
include = ["finseries*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
